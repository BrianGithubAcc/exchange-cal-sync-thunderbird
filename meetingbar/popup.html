<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff; --text: #1a1a2e; --text-secondary: #5f6368;
      --border: #dadce0; --primary: #0078D4; --success: #107C10;
      --warning: #FF8C00; --error: #D13438;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2a2a3e; --text: #e0e0e0; --text-secondary: #a0a0b0;
        --border: #3a3a4e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 12px; width: 280px;
    }
    h3 { font-size: 0.95em; margin-bottom: 6px; }
    .info { font-size: 0.85em; color: var(--text-secondary); margin-bottom: 10px; }
    .btn-row { display: flex; gap: 6px; }
    button {
      flex: 1; padding: 8px 6px; border: none; border-radius: 4px;
      font-size: 0.85em; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-accept { background: var(--success); color: #fff; }
    .btn-tentative { background: var(--warning); color: #fff; }
    .btn-decline { background: var(--error); color: #fff; }
    #status {
      margin-top: 8px; font-size: 0.85em; display: none;
      padding: 6px 8px; border-radius: 4px;
    }
    #status.visible { display: block; }
    #status.success { background: rgba(16,124,16,0.1); color: var(--success); }
    #status.error { background: rgba(209,52,56,0.1); color: var(--error); }
    #status.info { background: rgba(0,120,212,0.1); color: var(--primary); }
    #loading { text-align: center; padding: 20px; font-size: 0.9em; color: var(--text-secondary); }
    #content { display: none; }
    #notMeeting { display: none; text-align: center; padding: 16px; font-size: 0.9em; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div id="loading">Checking message...</div>
  <div id="notMeeting">This message is not a meeting invitation.</div>
  <div id="content">
    <h3 id="subject"></h3>
    <div class="info" id="details"></div>
    <div class="btn-row">
      <button class="btn-accept" id="btnAccept">&#10003; Accept</button>
      <button class="btn-tentative" id="btnTentative">? Tentative</button>
      <button class="btn-decline" id="btnDecline">&#10007; Decline</button>
    </div>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
